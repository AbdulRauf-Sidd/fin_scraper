PVH_news:
  ticker: PVH
  scraper: FlatListScraper
  url: https://www.pvh.com/news?facets=year%3D2025%7C2024%7C2023%7C2022%7C2021%7C2020%7C2019%26
  output: data/PVH_news.json
  base_address: https://www.pvh.com/
  periodic: true
  selectors:
    event_block: li.list__item                   # Each event is in a <li> with class "list__item"
  pagination:
    type: button
    next_button: button:has(i.mdi-chevron-right):not(.v-pagination__navigation--disabled)
  defaults:
    event_type: webcast
  cutoff:
    years_back: 5

PVH_press:
  ticker: PVH
  scraper: FlatListScraper
  url: https://www.pvh.com/news?facets=content_type%3DPress%20Releases
  output: data/PVH_news.json
  base_address: https://www.pvh.com/
  periodic: false
  category: 'news'
  geography: "US"
  llm: true
  selectors:
    event_block: li.list__item
    parent_event_block: div.content__main.col-md-8.offset-md-0.order-md-1.col-12.order-2                   # Each event is in a <li> with class "list__item"
  pagination:
    type: button
    next_button: button:has(i.mdi-chevron-right):not(.v-pagination__navigation--disabled)

PVH_reports:
  ticker: PVH
  scraper: FlatListScraper
